name: CI

# A push to a PR branch used to fire both `push` (unfiltered) and
# `pull_request`, running every job twice for the same commit. Restricting
# `push` to the long-lived branches leaves pre-merge validation to
# `pull_request` and post-merge validation to `push`, with no overlap.
on:
    push:
        branches: [main, dev]
    pull_request:
        branches: [main, dev]

# Least privilege by default. No CI job writes to the repository; anything
# that needs more must opt in at the job level, as publish.yml does for OIDC.
permissions:
    contents: read

# Superseded runs on the same ref are pointless once a newer commit exists.
# `main` is exempt: its runs validate merged history and must not be cancelled.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
    gen-drift:
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout code
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
              with:
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Build project
              run: npm run build

            - name: Run codemap drift check
              run: npm run codemap:check

            - name: Run skill drift check
              run: npm run skill:check

            - name: Run API mapping drift check
              run: npm run mapping:check

            - name: Run AGENTS.md drift check
              run: npm run agents-md:check

            - name: Run published-versions drift check
              run: npm run published:check

    lint-and-test:
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Checkout code
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
              with:
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Build project
              run: npm run build

            - name: Run TypeScript 7 type check
              run: npm run typecheck

            - name: Run TypeScript 6 compatibility check
              run: npm run typecheck:ts6

            - name: Run linting
              run: npm run lint

            - name: Check formatting
              run: npm run format:check

            - name: Verify lockfile trust policy
              run: npm run lockfile-lint

            - name: Run tests
              run: npm run test:coverage

    # One matrix instead of three near-identical jobs. Node stays pinned to the
    # single supported line (see docs/RELEASING.md); the axis that actually
    # varies is the OS, because the package smoke exercises platform-specific
    # path handling and the npm shim.
    package-smoke-matrix:
        name: Package smoke (${{ matrix.os }}, Node ${{ matrix.node-version }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-14]
                node-version: ['24']

        steps:
            - name: Checkout code
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
              with:
                  persist-credentials: false

            - name: Setup Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Smoke-test packed consumer and CLI
              run: npm run package:smoke

            - name: Verify report execution and operation settlement
              run: npx vitest run tests/report-execution-policy.test.ts tests/operation-settlement.test.ts tests/upload-settlement.test.ts tests/upload-cleanup-errors.test.ts

    # Collapses the matrix into one stable check name for branch protection.
    # A matrix leg that is skipped or cancelled must not read as success, so
    # the aggregate result is compared against 'success' explicitly.
    package-smoke-gate:
        name: package-smoke
        if: always()
        needs: [package-smoke-matrix]
        runs-on: ubuntu-latest

        steps:
            - name: Require every package smoke lane
              shell: bash
              env:
                  MATRIX_RESULT: '${{ needs.package-smoke-matrix.result }}'
              run: |
                  set -euo pipefail
                  if [[ "$MATRIX_RESULT" != 'success' ]]; then
                      echo "One or more package smoke lanes failed or were cancelled (result: $MATRIX_RESULT)." >&2
                      exit 1
                  fi

    fuzz:
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout code
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
              with:
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run CLI fuzz tests
              run: RUN_FUZZ=1 npx vitest run tests/cli-fuzz.test.ts

    security-audit:
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout code
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
              with:
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            # Production audit: the shipped artifact has one runtime dep (Zod).
            # --omit=dev keeps this gate focused on what consumers actually install.
            - name: Run security audit (production deps)
              run: npm audit --omit=dev --audit-level=moderate

            # Full-tree audit including dev dependencies; no advisories are allowlisted.
            - name: Run dependency vulnerability check
              run: npm run audit:dependencies
